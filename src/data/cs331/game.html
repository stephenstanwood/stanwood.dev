const LESSONS = [
 {module:1,title:'Ask what information the agent has—and what it needs.',html:`<p>A task environment describes the setting in which an agent acts. Its dimensions answer different questions. A world can be <strong>known but partially observable</strong>: the agent understands the rules, yet cannot see the whole current state. Poker illustrates this distinction.</p><table><caption>Environment dimensions</caption><thead><tr><th scope="col">Dimension</th><th scope="col">What to ask</th></tr></thead><tbody><tr><th scope="row">Observability</th><td>Do the sensors expose the relevant current state?</td></tr><tr><th scope="row">Single / multiagent</th><td>Do other agents’ choices affect the outcome?</td></tr><tr><th scope="row">Deterministic / nondeterministic</th><td>Does a given state and action determine the result?</td></tr><tr><th scope="row">Episodic / sequential</th><td>Does this decision affect future decisions?</td></tr><tr><th scope="row">Static / dynamic</th><td>Can the world change while the agent deliberates?</td></tr><tr><th scope="row">Discrete / continuous</th><td>Are the relevant states, actions, or time distinct or continuously varying?</td></tr><tr><th scope="row">Known / unknown</th><td>Does the agent know the rules and effects?</td></tr></tbody></table><p>A <strong>simple reflex</strong> agent acts on its current percept. A <strong>model-based</strong> agent keeps an internal state, using a transition model to predict changes and a sensor model to interpret observations. A <strong>goal-based</strong> agent compares future states with a goal. A <strong>utility-based</strong> agent also ranks outcomes, allowing tradeoffs under uncertainty.</p><p>Representations expose increasing structure: <strong>atomic</strong> states are indivisible labels; <strong>factored</strong> states contain variables; <strong>structured</strong> states contain objects, attributes, and relationships.</p><p class="scope-note">The conclusion excludes the first two Module 1 explorations. Practice focuses on environment classification and agent structure, corresponding to Quiz 1 questions 5–9.</p>`},
 {module:2,title:'Search algorithms differ in what they expand next.',html:`<p>A search problem needs a state representation, initial state, legal actions and transition model, goal test, and action costs. A <strong>state</strong> describes the world; a <strong>search node</strong> also represents a path through it. A finite graph can therefore unfold into an infinite tree if paths revisit states.</p><table><caption>Choosing the next frontier node</caption><thead><tr><th scope="col">Algorithm</th><th scope="col">Priority</th><th scope="col">Main consequence</th></tr></thead><tbody><tr><th scope="row">BFS</th><td>Shallowest first; FIFO</td><td>Fewest actions; least cost when action costs are equal. Broad memory use.</td></tr><tr><th scope="row">DFS</th><td>Deepest current branch; stack</td><td>Small frontier memory; can get stuck on an infinite path; not cost-optimal.</td></tr><tr><th scope="row">UCS</th><td>Lowest g(n)</td><td>Least-cost solution under the usual positive-cost assumptions.</td></tr><tr><th scope="row">Greedy</th><td>Lowest h(n)</td><td>Follows the estimated distance to the goal; no optimality guarantee.</td></tr><tr><th scope="row">A*</th><td>Lowest g(n) + h(n)</td><td>Combines cost so far and estimated cost remaining.</td></tr><tr><th scope="row">Iterative deepening</th><td>Repeated DFS with rising depth limits</td><td>BFS’s shallowest-goal property with DFS-like memory.</td></tr></tbody></table><p><strong>Completeness</strong> means finding a solution if one exists, subject to the algorithm’s assumptions. <strong>Optimality</strong> means finding a least-cost solution. These are different promises.</p><p>An <strong>admissible heuristic</strong> never overestimates the optimal remaining cost. Zero is admissible for nonnegative costs. Straight-line distance is a lower bound on geometric route length. Manhattan distance can overestimate when diagonal travel is allowed. A* needs an admissible heuristic; graph implementations must also handle improved paths correctly, or use the appropriate consistency assumptions.</p><p class="scope-note">Compare time and memory qualitatively; the instructor does not require memorizing complexity formulas. Questions ask concepts and tracing, rather than code.</p>`},
 {module:3,title:'A locally better move need not lead to the best state.',html:`<p><strong>Hill climbing</strong> keeps moving to an improving neighbor. It can stop at a local optimum because reaching a better region may require a temporary worsening move. More runtime alone does not repair that limitation. Minimizing this objective gives the same idea in the opposite direction.</p><p><strong>Simulated annealing</strong> sometimes accepts worsening moves. Cooling makes those moves less likely. <strong>Local beam search</strong> keeps k states and selects the best k candidates from their combined successors. It needs more memory than a single-state hill climber. In the course’s formulation, a beam of one reduces to hill climbing.</p><p>When an action has several possible outcomes, a solution must cover them all. In an <strong>AND–OR solution tree</strong>, an OR node chooses one action, an AND node provides a continuation for every possible outcome, and every leaf of a finite completed solution reaches a goal.</p><p>A <strong>belief state</strong> is a set of physical states consistent with the available information. Deterministic actions do not eliminate uncertainty about an unknown starting state. Prediction applies an action to each possible state; observation then removes incompatible states.</p><p>A sensorless agent needs a sequence that works from every possible starting state. For the two-room deterministic vacuum, <strong>Left, Suck, Right, Suck</strong> guarantees both rooms are clean. A partially observable agent can instead use percepts to choose a continuation in a conditional plan.</p>`},
 {module:4,title:'Back up the opponent’s choices before making yours.',html:`<p>Utilities are measured for MAX. At a <strong>MIN</strong> node, take the smallest child value. At a <strong>MAX</strong> node, take the largest. Work from the leaves upward. A root with MIN children [12, 6] and [4, 7] receives values 6 and 4, then chooses 6.</p><p><strong>Alpha-beta pruning</strong> avoids work that cannot change this decision. Alpha is the best value MAX can already secure along the path; beta is the best bound MIN can already secure. At a MIN node, once the current value is no higher than alpha, later children cannot make that branch attractive to MAX. At a MAX node, the corresponding cutoff occurs when the current value is at least beta.</p><p>For a two-ply tree searched left to right, fully evaluate the first MIN child. Carry its value as the root’s alpha into the next MIN branch. If that branch’s first leaf is already ≤ alpha, its remaining leaves can be skipped. Update alpha after each completed alternative.</p><p><strong>Order affects work, not the root value.</strong> Early strong alternatives establish useful bounds. Alpha-beta with the same tree and evaluation gives the same minimax value. A separate depth cutoff with a heuristic evaluation introduces approximation.</p><p class="scope-note">Practice uses the same two-ply scale as Quiz 4. In question 4, the actual diagram has C leaves 2, 4, 5 and D leaves 14, 3, 1; its expandable description lists different values. This game follows the actual diagram.</p>`},
 {module:5,title:'Remove values without support. Backtrack only when needed.',html:`<p>A CSP defines variables, domains, and constraints. A solution is a <strong>complete, consistent assignment</strong>. Domains with values remaining are not themselves a solution.</p><p>To revise <strong>(X, Y)</strong>, test each value x in X’s domain. Keep x only if there is at least one y satisfying the constraints with it. This revision can prune <strong>X, the left variable</strong>; Y is unchanged by this one arc. Where two constraints apply to the same pair, the supporting pair must satisfy both.</p><p><strong>AC-3</strong> repeats revisions. If X loses values, neighbors may lose their support in X, so arcs of the form (Z, X) may need another check. An empty domain proves failure for the current CSP. Nonempty domains do not prove a solution: a two-color triangle remains arc-consistent but is globally impossible.</p><p>Basic <strong>backtracking</strong> assigns one variable at a time. Follow the stated variable order and value order. Reject a candidate as soon as it violates a constraint involving assigned variables. Try the variable’s next value before changing an earlier variable. Only after exhausting its values do you return to the previous variable.</p><p>Keep similar constraints distinct. With A = 2 and B = 1, <strong>C &gt; A</strong> first allows C = 3, while <strong>C &gt; B</strong> first allows C = 2. They are different CSPs, even if all their other text matches.</p><p class="scope-note">The conclusion specifies applying AC-3 and backtracking. There are no implementation questions in this game.</p>`}
];

const SCHEMA = 1;
function rng(seed=1){let x=seed>>>0;return()=>{x+=0x6D2B79F5;let t=x;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296;};}
function shuffle(items,seed){const a=[...items],r=typeof seed==='function'?seed:rng(seed);for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function optionOrder(q,seed){if(q.options?.length===2&&q.options[0]==='True'&&q.options[1]==='False')return[0,1];return shuffle(q.options?.map((_,i)=>i)??[],seed);}
function answered(q,a){if(q.kind==='number')return typeof a==='string'&&a.trim()!==''&&Number.isFinite(Number(a))&&Number.isInteger(Number(a));if(q.kind==='match')return Array.isArray(a)&&a.length===q.pairs.length&&a.every(x=>typeof x==='string'&&x.length>0);if(q.kind==='multi')return Array.isArray(a)&&a.length>0;return Number.isInteger(a)&&a>=0&&a<q.options.length;}
function grade(q,a){if(!answered(q,a))return{correct:false,score:0};if(q.kind==='number'){const ok=Number(a)===q.number;return{correct:ok,score:ok?1:0};}if(q.kind==='match'){const n=q.pairs.filter((p,i)=>p[1]===a[i]).length;return{correct:n===q.pairs.length,score:n/q.pairs.length};}const aa=Array.isArray(a)?[...a].sort():[a],cc=[...q.correct].sort();const ok=aa.length===cc.length&&aa.every((v,i)=>v===cc[i]);return{correct:ok,score:ok?1:0};}
function emptyProgress(){return{schema:SCHEMA,stats:{},attempts:[]};}
function record(progress,q,answer,{key,at=Date.now()}={}){if(progress.attempts.some(a=>a.key===key))return false;const result=grade(q,answer),s=progress.stats[q.id]??{seen:0,correct:0,streak:0,lastAt:0};s.seen++;s.correct+=Number(result.correct);s.streak=result.correct?s.streak+1:0;s.lastCorrect=result.correct;s.lastAt=at;progress.stats[q.id]=s;progress.attempts.push({key,id:q.id,module:q.module,correct:result.correct,score:result.score,at});progress.attempts=progress.attempts.slice(-1500);return true;}
function selectQuestions(bank,progress,{kind='practice',topic=0,seed=1}={}){
 const r=rng(seed),filtered=bank.filter(q=>(!topic||q.module===topic)&&(kind!=='canvas'||q.source.kind==='canvas'));
 if(kind==='canvas')return shuffle(filtered,r).map(q=>q.id);
 const modules=topic?[topic]:[1,2,3,4,5],count=kind==='exam'?30:10,picked=[];
 // Equal practice coverage is a study choice, not a prediction of exam weights.
 for(let i=0;i<count;i++){
   const m=modules[i%modules.length];let candidates=filtered.filter(q=>q.module===m&&!picked.includes(q.id));
   if(!candidates.length)candidates=filtered.filter(q=>!picked.includes(q.id));
   if(!candidates.length)break;
   if(kind==='exam'){
     const originals=candidates.filter(q=>q.source.kind==='canvas');
     const pool=originals.length&&r()<.7?originals:candidates;
     picked.push(pool[Math.floor(r()*pool.length)].id);
   }else{
     const ranked=candidates.map(q=>{const s=progress.stats[q.id];const base=!s?5:!s.lastCorrect?7:s.streak<2?2:0;const recent=s?.lastAt&&Date.now()-s.lastAt<120000?4:0;return{q,score:base-recent+r()*1.5};}).sort((a,b)=>b.score-a.score);
     picked.push(ranked[0].q.id);
   }
 }
 return shuffle(picked,r);
}
function createSession(bank,progress,options={}){const now=options.now??Date.now(),seed=options.seed??(now>>>0);return{id:`${now}-${seed}`,kind:options.kind??'practice',topic:options.topic??0,ids:selectQuestions(bank,progress,{...options,seed}),index:0,questionOffset:0,answers:{},checked:{},flags:{},startedAt:now,deadline:options.kind==='exam'?now+110*60000:null,seed,finished:false};}
function advancePracticeSession(session,bank,progress){
 if(session.kind==='exam'||session.finished||!session.checked[session.ids[session.index]])return false;
 if(session.index<session.ids.length-1){session.index++;return true;}
 // Refill a bounded queue without interrupting practice or growing saved state.
 const previous=session.ids[session.index];
 session.questionOffset=(Number.isSafeInteger(session.questionOffset)?session.questionOffset:0)+session.ids.length;
 session.seed=(session.seed+0x9e3779b9)>>>0;
 session.ids=selectQuestions(bank,progress,{kind:session.kind,topic:session.topic,seed:session.seed});
 if(session.ids[0]===previous&&session.ids.length>1)session.ids.push(session.ids.shift());
 session.index=0;
 session.id=`${session.startedAt}-${session.seed}-${session.questionOffset}`;
 session.answers={};session.checked={};session.flags={};
 return session.ids.length>0;
}
function finishSession(s,bank,progress,at=Date.now()){if(s.finished)return;for(const id of s.ids){const q=bank.find(q=>q.id===id);if(q)record(progress,q,s.answers[id],{key:`${s.id}:${id}`,at});}s.finished=true;s.finishedAt=at;}
function summarize(s,bank){let right=0,score=0,complete=0;for(const id of s.ids){const q=bank.find(q=>q.id===id);if(!q)continue;const a=s.answers[id],g=grade(q,a);right+=Number(g.correct);score+=g.score;complete+=Number(answered(q,a));}return{right,score,complete,total:s.ids.length};}
function validateBackup(value,bank){if(!value||value.schema!==SCHEMA||!value.stats||!Array.isArray(value.attempts))throw Error('This is not a Midterm Lab progress backup.');const ids=new Set(bank.map(q=>q.id)),p=emptyProgress();for(const [id,s]of Object.entries(value.stats)){if(!ids.has(id))continue;if(!s||!['seen','correct','streak','lastAt'].every(k=>Number.isFinite(s[k])&&s[k]>=0)||s.correct>s.seen||s.streak>s.correct)throw Error('The progress backup has invalid counts.');p.stats[id]={seen:s.seen,correct:s.correct,streak:s.streak,lastAt:s.lastAt,lastCorrect:!!s.lastCorrect};}p.attempts=value.attempts.filter(a=>a&&ids.has(a.id)&&typeof a.key==='string'&&typeof a.correct==='boolean'&&Number.isFinite(a.at)).slice(-1500).map(a=>({key:a.key,id:a.id,module:bank.find(q=>q.id===a.id).module,correct:a.correct,score:Number.isFinite(a.score)?Math.max(0,Math.min(1,a.score)):Number(a.correct),at:a.at}));return p;}

let progress=emptyProgress(),session=null,page='home',topic=0,noteTopic=1,bankVariant=false,search='',saveOkay=true;
try{const saved=JSON.parse(localStorage.getItem(KEY));if(saved){progress=validateBackup(saved.progress,BANK);if(saved.session&&['practice','canvas','exam'].includes(saved.session.kind)&&saved.session.ids?.length<=BANK.length&&saved.session.ids.every(id=>byId.has(id))&&saved.session.index>=0&&saved.session.index<saved.session.ids.length)session=saved.session;}}catch{}
function save(){try{localStorage.setItem(KEY,JSON.stringify({progress,session}));saveOkay=true;}catch{saveOkay=false;}const n=$('#saveNotice');if(n)n.textContent=saveOkay?'Progress saves in this browser. Export it to move between devices.':'Progress cannot be saved in this browser. Export it before closing.';}
const icon=`<svg viewBox="0 0 28 28" aria-hidden="true"><path d="M14 6v7M14 13H5v8M14 13h9v8" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="14" cy="5" r="3" fill="currentColor"/><circle cx="5" cy="23" r="3" fill="currentColor"/><circle cx="23" cy="23" r="3" fill="currentColor"/></svg>`;
function shell(content){document.body.classList.toggle('practice-view',page==='session'&&session?.kind!=='exam');$('#app').innerHTML=`<a href="#main" class="skip">Skip to study content</a><header><button class="brand" data-page="home">${icon}<span>Midterm Lab<small>CS 331 / Fall 2026</small></span></button><nav aria-label="Study navigation">${[['home','Practice'],['notes','Learn'],['bank','Questions'],['progress','Progress']].map(([id,label])=>`<button data-page="${id}" ${page===id?'aria-current="page"':''}>${label}</button>`).join('')}<a href="${GAME_BASE}/outline">Outline</a></nav><button class="exam-link" data-page="info">Exam info <span aria-hidden="true">↗</span></button></header><main id="main" tabindex="-1">${content}</main><footer><span id="saveNotice">${saveOkay?'Progress saves in this browser. Export it to move between devices.':'Progress cannot be saved. Export it before closing.'}</span><span>Current quiz level · Modules 1–5</span></footer><div id="announcer" class="sr" role="status" aria-live="polite"></div><dialog id="finishDialog"><form method="dialog"><h2>Finish this rehearsal?</h2><p id="finishText"></p><div class="actions"><button value="cancel" class="secondary">Keep working</button><button type="button" data-action="finish-confirm" class="primary">Finish and review</button></div></form></dialog><dialog id="importDialog"><h2>Replace this browser’s progress?</h2><p>The selected backup will replace the study history saved here. Export the current history first if you want to keep it.</p><div class="actions"><button class="secondary" data-action="import-cancel">Cancel</button><button class="primary" data-action="import-confirm">Use backup</button></div></dialog>`;}
function topicButtons(selected=0,attr='topic'){return`<div class="topic-buttons" aria-label="Choose a module"><button data-${attr}="0" aria-pressed="${selected===0}">All modules</button>${TOPICS.map(t=>`<button data-${attr}="${t.id}" aria-pressed="${selected===t.id}">${t.short}</button>`).join('')}</div>`;}
function moduleRows(){return TOPICS.map(t=>{const bank=BANK.filter(q=>q.module===t.id),seen=bank.filter(q=>progress.stats[q.id]).length;return`<button class="module-row" data-start-topic="${t.id}"><span class="module-dot" style="--topic:${t.color}">${t.id}</span><span class="module-title"><strong>${t.name}</strong><small>${t.description}</small></span><span class="module-coverage"><span>${seen} / ${bank.length} seen</span><progress max="${bank.length}" value="${seen}" aria-label="Module ${t.id} question coverage"></progress></span><span aria-hidden="true" class="chevron">›</span></button>`;}).join('');}
function home(){const original=BANK.filter(q=>q.source.kind==='canvas'),seen=original.filter(q=>progress.stats[q.id]).length;shell(`<section class="home-intro"><div><p class="course-line">Nauman Chaudhry’s CS 331 midterm</p><h1>Work through it.<br>Know why it works.</h1><p class="intro-copy">The current quizzes, the same problem scale, and a clear explanation after every answer.</p></div><div class="intro-diagram" aria-hidden="true"><span class="diagram-heading">Choose. Trace. Explain.</span>${gameSVG([[6,12,8],[2,4,5],[14,3,1]],false,true)}</div></section><section class="outline-invite" aria-labelledby="outlineInviteTitle"><div><h2 id="outlineInviteTitle">Start with the whole picture.</h2><p>A friendly guide to all five modules, with examples and a clear starting plan.</p></div><a class="secondary" href="${GAME_BASE}/outline">Read the full outline</a></section>${session&&!session.finished?`<section class="resume"><div><strong>Your ${session.kind==='exam'?'rehearsal':'practice'} is saved.</strong><span>Question ${(session.questionOffset||0)+session.index+1}${session.kind==='exam'?` of ${session.ids.length} · The rehearsal clock keeps running.`:''}</span></div><button class="primary" data-action="resume">Continue</button></section>`:''}<div class="home-grid"><section class="practice-panel"><div class="panel-heading"><h2>Practice at your pace.</h2><span class="quiet">No time limit</span></div><p>Keep going with new questions and concepts that need another look. Stop whenever you like.</p>${topicButtons(topic)}<button class="primary start" data-action="practice">Start practice <span aria-hidden="true">↗</span></button><div class="other-modes"><button data-action="canvas"><span class="mode-icon" aria-hidden="true">≡</span><span><strong>Quiz questions only</strong><small>All 41 in-scope prompts, then keep going</small></span><span aria-hidden="true">›</span></button><button data-action="exam"><span class="mode-icon" aria-hidden="true">◷</span><span><strong>Exam rehearsal</strong><small>30 questions · 110 minutes</small></span><span aria-hidden="true">›</span></button></div></section><aside class="exam-brief"><h2>This exam</h2><p class="date">Oct 30 – Nov 3</p><dl><div><dt>Scope</dt><dd>Modules 1–5</dd></div><div><dt>Format</dt><dd>About 30 questions</dd></div><div><dt>Time</dt><dd>110 minutes</dd></div><div><dt>Materials</dt><dd>Closed notes; no scratch paper</dd></div></dl><p>Complete the Proctorio practice before starting the real exam.</p><button class="text-button" data-page="info">Read the professor’s guidance</button></aside></div><section class="module-section"><div class="panel-heading"><h2>Five modules. One clear scope.</h2><span class="quiet">${seen} / 41 quiz prompts seen</span></div><div class="module-list">${moduleRows()}</div></section>`);}
function gameSVG(rows,reveal=false,decorative=false){const w=720,h=270,n=rows.length,mins=rows.map(r=>Math.min(...r)),pruned=reveal?prunedRows(rows):[];let elements='';rows.forEach((row,i)=>{const x=65+(i+.5)*(590/n),y=111;elements+=`<path d="M360 47L${x} 95" class="edge"/><path d="M${x-22} ${y-13}L${x+22} ${y-13}L${x} ${y+22}Z" class="min-node"/><text x="${x}" y="${y+4}" class="node-text">${String.fromCharCode(66+i)}${reveal?' = '+mins[i]:''}</text>`;row.forEach((v,j)=>{const lx=x+(j-(row.length-1)/2)*54,ly=208,skip=pruned.some(p=>p.row===i&&p.index===j);elements+=`<g class="${skip?'pruned':''}"><path d="M${x} 132L${lx} 188" class="edge"/><rect x="${lx-19}" y="${ly-18}" width="38" height="36" rx="9" class="leaf"/><text x="${lx}" y="${ly+6}" class="leaf-text">${v}</text><text x="${lx}" y="${ly+41}" class="leaf-label">${String.fromCharCode(66+i)}${j+1}</text>${skip?`<path d="M${lx-17} ${ly+16}l34 -32" class="prune-mark"/>`:''}</g>`;});});return`<svg viewBox="0 0 ${w} ${h}" ${decorative?'aria-hidden="true"':`role="img" aria-label="MAX root A with ${n} MIN children; leaf utilities are shown beneath them."`}><path d="M360 7L386 51H334Z" class="max-node"/><text x="360" y="41" class="node-text">A${reveal?' = '+minimaxRows(rows):''}</text>${elements}</svg>`;}
function mobileGame(rows,reveal=false){const skip=reveal?prunedRows(rows):[];return `<div class="mobile-game" role="img" aria-label="MAX root A with MIN children and leaf utilities"><div class="mobile-root">A · MAX${reveal?' = '+minimaxRows(rows):''}</div>${rows.map((r,i)=>`<div class="mobile-branch"><span class="mobile-min">${String.fromCharCode(66+i)} · MIN${reveal?' = '+Math.min(...r):''}</span><div class="mobile-leaves">${r.map((v,j)=>`<span class="mobile-leaf ${skip.some(p=>p.row===i&&p.index===j)?'is-pruned':''}"><strong>${v}</strong><small>${String.fromCharCode(66+i)}${j+1}</small></span>`).join('')}</div></div>`).join('')}</div>`;}
function diagram(q,reveal=false){const d=q.diagram;if(!d)return'';let svg='',text='';if(d.type==='game'){svg=gameSVG(d.rows,reveal);text=`A is MAX. ${d.rows.map((r,i)=>`${String.fromCharCode(66+i)} is MIN, with leaves ${r.map((v,j)=>`${String.fromCharCode(66+i)}${j+1} = ${v}`).join(', ')}.`).join(' ')} Visit branches and leaves left to right.`;}if(d.type==='search'){const pos={A:[340,28],B:[100,100],C:[320,100],D:[590,100],F:[235,175],G:[400,175],E:[590,175],H:[235,250],I:[400,250],K:[235,325],J:[400,325],L:[235,400]};svg=`<svg viewBox="0 0 700 435" role="img" aria-label="Search tree rooted at A">${d.edges.map(([a,b])=>`<path d="M${pos[a]}L${pos[b]}" class="edge"/>`).join('')}${Object.entries(pos).map(([n,[x,y]])=>`<circle cx="${x}" cy="${y}" r="19" class="leaf"/><text x="${x}" y="${y+6}" class="leaf-text">${n}</text>`).join('')}</svg>`;text='Children left to right: A → B, C, D; C → F, G; D → E; F → H; H → K; K → L; G → I; I → J.';}if(d.type==='landscape'){const vs=d.values,max=Math.max(...vs,1);const pts=vs.map((v,i)=>[38+i*(620/(vs.length-1)),175-v/max*120]);svg=`<svg viewBox="0 0 700 220" role="img" aria-label="Neighboring objective values: ${vs.join(', ')}"><path d="M30 185H670" class="axis"/><polyline points="${pts.map(p=>p.join(',')).join(' ')}" fill="none" class="land-line"/>${pts.map(([x,y],i)=>`<circle cx="${x}" cy="${y}" r="6" class="max-node"/><text x="${x}" y="${y-14}" class="leaf-text">${vs[i]}</text>`).join('')}</svg>`;text=`A line of neighboring states, left to right: ${vs.join(', ')}. Start at the left end.`;}if(d.type==='triangle'||d.type==='australia'){const australia=d.type==='australia',pos=australia?{WA:[90,110],NT:[270,45],SA:[300,175],Q:[490,55],NSW:[520,170],V:[440,255],T:[580,280]}:{X:[350,45],Y:[210,210],Z:[490,210]},edges=australia?[['WA','NT'],['WA','SA'],['NT','SA'],['NT','Q'],['SA','Q'],['SA','NSW'],['SA','V'],['Q','NSW'],['NSW','V']]:[['X','Y'],['Y','Z'],['Z','X']];svg=`<svg viewBox="0 0 700 330" role="img" aria-label="${australia?'Australia map-coloring constraint graph':'Triangle CSP with three not-equal constraints'}">${edges.map(([a,b])=>`<path d="M${pos[a]}L${pos[b]}" class="edge"/>`).join('')}${Object.entries(pos).map(([n,[x,y]])=>`<circle cx="${x}" cy="${y}" r="25" class="leaf"/><text x="${x}" y="${y+6}" class="leaf-text">${n}</text>${australia?'':`<text x="${x}" y="${y+46}" class="leaf-label">{1, 2}</text>`}`).join('')}</svg>`;text=edges.map(e=>e.join(' ≠ ')).join('; ')+(australia?'. Tasmania is isolated.':'. All three domains are {1,2}.');}return`<figure class="problem-figure"><div class="diagram-scroll ${d.type==='game'?'desktop-game':''}" tabindex="0" aria-label="Problem diagram; scroll horizontally if needed">${svg}</div>${d.type==='game'?mobileGame(d.rows,reveal):''}<figcaption>${d.type==='game'?'Utilities are for MAX. Visit children from left to right.':d.type==='landscape'?'Only neighboring states are connected.':d.type==='search'?'Children are ordered from left to right.':'An edge requires different values.'}</figcaption><details class="text-alternative"><summary>Text version of the diagram</summary><p>${esc(text)}</p></details></figure>`;}
function controls(q){const a=session.answers[q.id],locked=!!session.checked[q.id]&&session.kind!=='exam';if(q.kind==='number')return`<fieldset class="numeric" ${locked?'disabled':''}><legend>Enter your answer</legend><label for="numericAnswer">Number of solutions</label><input id="numericAnswer" type="number" min="0" step="1" inputmode="numeric" enterkeyhint="done" value="${esc(a??'')}"></fieldset>`;if(q.kind==='match')return`<fieldset class="matching" ${locked?'disabled':''}><legend>Match each item</legend>${q.pairs.map(([label],i)=>`<div class="match-row"><label for="pair-${i}">${esc(label)}</label><select id="pair-${i}" data-pair="${i}"><option value="">Choose an answer</option>${shuffle(q.choices,session.seed+session.index*17+i).map(v=>`<option ${a?.[i]===v?'selected':''} value="${esc(v)}">${esc(v)}</option>`).join('')}</select></div>`).join('')}</fieldset>`;return`<fieldset class="answers" ${locked?'disabled':''}><legend>${q.kind==='multi'?'Select every correct answer':'Choose one answer'}</legend>${optionOrder(q,session.seed+session.index*97).map((i,j)=>{const selected=Array.isArray(a)?a.includes(i):a===i,revealed=locked,correct=q.correct.includes(i);return`<label class="answer ${selected?'selected':''} ${revealed&&correct?'answer-correct':''} ${revealed&&selected&&!correct?'answer-wrong':''}" for="answer-${i}"><input id="answer-${i}" type="${q.kind==='multi'?'checkbox':'radio'}" name="answer" value="${i}"><span class="answer-letter" aria-hidden="true">${String.fromCharCode(65+j)}</span><span>${esc(q.options[i])}</span>${revealed&&correct?'<span class="answer-mark">✓<span class="sr">Correct answer</span></span>':''}</label>`;}).join('')}</fieldset>`;}
function answerDescription(q,a){if(!answered(q,a))return'Not answered';if(q.kind==='number')return a;if(q.kind==='match')return q.pairs.map((p,i)=>`${p[0]}: ${a[i]}`).join('; ');return (Array.isArray(a)?a:[a]).map(i=>q.options[i]).join(', ');}
function correctDescription(q){return q.kind==='number'?String(q.number):q.kind==='match'?q.pairs.map(p=>p.join(': ')).join('; '):q.correct.map(i=>q.options[i]).join(', ');}
function feedback(q){const g=grade(q,session.answers[q.id]);return`<section class="feedback ${g.correct?'correct':'review'}"><h2 id="feedbackTitle" tabindex="-1">${g.correct?'That’s right.':'Let’s work through it.'}</h2>${g.correct?'':`<p class="correct-answer"><strong>Answer:</strong> ${esc(correctDescription(q))}</p>`}<p>${esc(q.why)}</p>${q.steps?`<ol>${q.steps.map(s=>`<li>${esc(s)}</li>`).join('')}</ol>`:''}${q.note?`<p class="source-note">${esc(q.note)}</p>`:''}<a href="${q.source.url}" target="_blank" rel="noopener">${esc(q.source.label)}</a></section>`;}
function renderQuestion(){
 if(!session)return go('home');
 if(session.finished)return summary();
 page='session';
 const q=byId.get(session.ids[session.index]);
 const isExam=session.kind==='exam',checked=!!session.checked[q.id]&&!isExam;
 const diagramHTML=diagram(q,checked);
 const workspace=!isExam&&q.diagram
   ?`<div class="question-workspace"><div class="question-visual">${diagramHTML}</div><div class="question-response">${controls(q)}</div></div>`
   :controls(q);
 const hint=checked?'Enter continues':q.kind==='number'?'Enter a number, then press Enter':q.kind==='match'?'Finish the matches to see the explanation':q.kind==='multi'?'Select all that apply, then show the explanation':`Click an answer or press 1–${q.options.length}`;
 const source=`<details class="question-source"><summary>Question source</summary><p>${esc(q.source.label)}${q.adapted?'. '+esc(q.adapted):'. Wording and formatting are lightly adapted for this game.'}</p><a href="${q.source.url}" target="_blank" rel="noopener">Open the Canvas quiz</a></details>`;
 const practiceAction=!checked&&q.kind==='multi'
   ?`<button class="primary" data-action="check" ${!answered(q,session.answers[q.id])?'disabled':''}>Show explanation</button>`
   :`<button class="primary" data-action="next" ${!checked?'disabled':''}>Next question</button>`;
 shell(`
  <div class="session-top">
   <button class="text-button" data-page="home">${isExam?'‹ Save and return':'Pause practice'}</button>
   <span>${isExam?'Exam rehearsal':session.kind==='canvas'?'Quiz questions':'Practice'}</span>
   ${isExam?'<span class="clock" id="clock" aria-label="Time remaining"></span>':`<div class="session-tools"><span class="quiet">Question ${(session.questionOffset||0)+session.index+1}</span><button class="text-button" data-learn-topic="${q.module}">Module notes</button></div>`}
  </div>
  ${isExam?`<progress class="session-progress" max="${session.ids.length}" value="${summarize(session,BANK).complete}" aria-label="Rehearsal progress"></progress>`:'<div class="practice-divider" aria-hidden="true"></div>'}
  <div class="question-layout ${isExam?'':'practice-layout'}">
   <article class="question-card" data-question-id="${q.id}">
    <div class="question-meta"><span style="--topic:${TOPICS[q.module-1].color}" class="topic-tag">Module ${q.module} · ${TOPICS[q.module-1].short}</span><span class="quiet">${q.source.kind==='canvas'?'Quiz-based':'Equivalent practice'}</span></div>
    <h1 id="questionTitle" tabindex="-1">${esc(q.prompt)}</h1>
    ${isExam?diagramHTML+controls(q):workspace}
    ${checked?feedback(q):''}
    <div class="question-actions">${isExam?`
     <button class="secondary" data-action="prev" ${session.index===0?'disabled':''}>Previous</button>
     <button class="text-button flag" data-action="flag" aria-pressed="${!!session.flags[q.id]}">${session.flags[q.id]?'Flagged for review':'Flag for review'}</button>
     <button class="primary" data-action="${session.index===session.ids.length-1?'finish':'next'}">${session.index===session.ids.length-1?'Finish rehearsal':'Next question'}</button>
    `:`${practiceAction}<span class="key-help">${hint}</span>${source}`}</div>
   </article>
   ${isExam?`<aside class="session-aside"><h2>Rehearsal map</h2><p>Answers stay hidden until you finish.</p><div class="question-map">${session.ids.map((id,i)=>`<button data-jump="${i}" class="${i===session.index?'current':''} ${answered(byId.get(id),session.answers[id])?'done':''}" aria-label="Question ${i+1}${session.flags[id]?', flagged':''}${answered(byId.get(id),session.answers[id])?', answered':', unanswered'}" ${i===session.index?'aria-current="step"':''}>${i+1}${session.flags[id]?'<span aria-hidden="true">•</span>':''}</button>`).join('')}</div><button class="secondary wide" data-action="finish">Finish rehearsal</button><p class="small">The clock continues if you leave or reload. This is a practice mix, not a prediction of module weights.</p></aside>`:''}
  </div>`);
 if(q.kind!=='match')for(const input of document.querySelectorAll('input[name="answer"]'))input.checked=Array.isArray(session.answers[q.id])?session.answers[q.id].includes(Number(input.value)):session.answers[q.id]===Number(input.value);
 if(isExam)tick();
}
function summary(){page='summary';const s=summarize(session,BANK),pct=Math.round(s.right/s.total*100);shell(`<section class="summary-head"><p class="course-line">${session.kind==='exam'?'Rehearsal complete':'Practice review'}</p><h1>${s.right} of ${s.total} correct.</h1><p>${pct}% on this set. Use the explanations below to resolve anything that felt uncertain.</p><div class="actions"><button class="primary" data-action="practice">Keep practicing</button><button class="secondary" data-page="progress">View progress</button></div></section><section class="review-list"><h2>Your answer review</h2>${session.ids.map((id,i)=>{const q=byId.get(id),g=grade(q,session.answers[id]);return`<details class="review-item" ${g.correct?'':'open'}><summary><span class="result-icon ${g.correct?'good':'miss'}">${g.correct?'✓':'↺'}</span><span><strong>Question ${i+1}</strong> ${esc(q.prompt)}</span></summary><div class="review-body"><p><strong>Your answer:</strong> ${esc(answerDescription(q,session.answers[id]))}</p>${g.correct?'':`<p><strong>Correct answer:</strong> ${esc(correctDescription(q))}</p>`}${diagram(q,true)}<p>${esc(q.why)}</p>${q.steps?`<ol>${q.steps.map(x=>`<li>${esc(x)}</li>`).join('')}</ol>`:''}<a href="${q.source.url}" target="_blank" rel="noopener">${esc(q.source.label)}</a></div></details>`;}).join('')}</section>`);}
function notes(){const l=LESSONS.find(l=>l.module===noteTopic);shell(`<div class="page-heading"><p class="course-line">Concept notes</p><h1>The reason behind the answer.</h1><p>Read the mechanism, then apply it at the same level as the quizzes.</p></div><div class="learn-layout"><nav class="lesson-nav" aria-label="Module notes">${TOPICS.map(t=>`<button data-note="${t.id}" ${noteTopic===t.id?'aria-current="page"':''}><span>${t.id}</span>${t.name}</button>`).join('')}</nav><article class="lesson"><span class="topic-tag" style="--topic:${TOPICS[noteTopic-1].color}">Module ${noteTopic}</span><h2>${l.title}</h2>${l.html}<div class="actions"><button class="primary" data-start-topic="${noteTopic}">Practice this module</button><a href="https://canvas.oregonstate.edu/courses/2079176/pages/${TOPICS[noteTopic-1].conclusion}" target="_blank" rel="noopener">Professor’s midterm scope</a></div></article></div>`);}
function filteredBank(){return BANK.filter(q=>(!topic||q.module===topic)&&(bankVariant||q.source.kind==='canvas')&&(!search||`${q.prompt} ${q.why} ${q.source.label}`.toLowerCase().includes(search.toLowerCase())));}
function bankItems(){const list=filteredBank();return`<p class="quiet">${list.length} questions</p>${list.map(q=>`<details class="bank-item"><summary><span class="topic-tag" style="--topic:${TOPICS[q.module-1].color}">Module ${q.module}</span><span>${esc(q.prompt)}</span><span class="bank-kind">${q.kind==='number'?'Numeric':q.kind==='match'?'Matching':q.options?.join('|')==='True|False'?'True / False':'Multiple choice'}</span></summary><div class="bank-body">${diagram(q)}${q.kind==='number'?'<p>Enter a numeric answer.</p>':q.kind==='match'?`<ul>${q.pairs.map(p=>`<li>${esc(p[0])}</li>`).join('')}</ul>`:`<ul>${q.options.map(a=>`<li>${esc(a)}</li>`).join('')}</ul>`}<details class="solution"><summary>Show answer and reasoning</summary><p><strong>${esc(correctDescription(q))}</strong></p><p>${esc(q.why)}</p>${q.note?`<p>${esc(q.note)}</p>`:''}</details><p class="small">${esc(q.source.label)}${q.adapted?'. '+esc(q.adapted):''}</p><a href="${q.source.url}" target="_blank" rel="noopener">Open source quiz</a></div></details>`).join('')||'<p>No questions match. Try a different module or search.</p>'}`;}
function bankPage(){shell(`<div class="page-heading"><p class="course-line">Question library</p><h1>The questions behind the practice.</h1><p>41 quiz-based prompts plus equivalent variants. No material from excluded modules.</p></div><section class="bank-toolbar">${topicButtons(topic)}<div class="bank-search"><label for="bankSearch">Search questions</label><input id="bankSearch" type="search" value="${esc(search)}" placeholder="Search a concept or question"><label class="check-line"><input type="checkbox" id="showVariants" ${bankVariant?'checked':''}> Include equivalent practice</label></div></section><div id="bankList">${bankItems()}</div>`);}
function progressPage(){const seen=BANK.filter(q=>progress.stats[q.id]).length,attempts=progress.attempts,right=attempts.filter(a=>a.correct).length;shell(`<div class="page-heading"><p class="course-line">Study history</p><h1>See what’s getting clearer.</h1><p>These are practice results, not a prediction of your exam grade.</p></div><section class="stat-strip"><div><strong>${seen}<span> / ${BANK.length}</span></strong><span>Questions encountered</span></div><div><strong>${attempts.length}</strong><span>Recorded answers</span></div><div><strong>${attempts.length?Math.round(right/attempts.length*100)+'%':'—'}</strong><span>Recorded answer accuracy</span></div></section><section class="progress-table-wrap"><table class="progress-table"><caption>Progress by module</caption><thead><tr><th scope="col">Module</th><th scope="col">Quiz coverage</th><th scope="col">Recent accuracy</th><th scope="col">Needs another look</th><th scope="col">Practice</th></tr></thead><tbody>${TOPICS.map(t=>{const originals=BANK.filter(q=>q.module===t.id&&q.source.kind==='canvas'),n=originals.filter(q=>progress.stats[q.id]).length,recent=attempts.filter(a=>a.module===t.id).slice(-20),miss=BANK.filter(q=>q.module===t.id&&progress.stats[q.id]&&!progress.stats[q.id].lastCorrect).length;return`<tr><th scope="row">${t.id}. ${t.name}</th><td>${n} / ${originals.length}</td><td>${recent.length?Math.round(recent.filter(a=>a.correct).length/recent.length*100)+'%':'—'}<small>${recent.length?`last ${recent.length} answers`:'No answers yet'}</small></td><td>${miss}</td><td><button class="secondary" data-start-topic="${t.id}">Practice</button></td></tr>`;}).join('')}</tbody></table></section><section class="backup-panel"><div><h2>Take your progress with you.</h2><p>Download a backup before switching browsers or devices. Importing replaces the history on that device.</p></div><div class="actions"><button class="secondary" data-action="export">Export progress</button><label class="button secondary" for="importFile">Import progress</label><input id="importFile" class="file-input" type="file" accept="application/json,.json"><p id="importStatus" class="small" role="status"></p></div></section>`);}
function info(){shell(`<div class="page-heading"><p class="course-line">Verified October 28, 2026</p><h1>Your exam, as posted.</h1><p>Current instructor guidance sets the scope of this game.</p></div><div class="info-grid"><section class="info-panel"><h2>Logistics</h2><dl><div><dt>Instructor</dt><dd>${EXAM.instructor}</dd></div><div><dt>Opens</dt><dd>Friday, ${EXAM.opens}, Pacific</dd></div><div><dt>Due</dt><dd>Tuesday, ${EXAM.due}, Pacific</dd></div><div><dt>Length</dt><dd>110 minutes; about 30 questions</dd></div><div><dt>Weight</dt><dd>20% of the course grade</dd></div><div><dt>Conditions</dt><dd>Proctored; closed notes; no scratch paper</dd></div></dl><p>The Proctorio practice must be completed successfully before the real exam can be started.</p><a href="${EXAM.announcement}" target="_blank" rel="noopener">October 19 midterm announcement</a></section><section class="info-panel"><h2>Question style</h2><p>Multiple choice, matching, True/False, and similar formats. There are no essays and no questions asking you to write or interpret code.</p><p>The professor points to the module quizzes, the five conclusion sections, and high-level programming-assignment concepts.</p><p>The 30-question rehearsal uses an even practice mix across modules. The professor has not published a module-by-module question allocation.</p><p>Actual exam questions are unreleased. This game matches the available practice material and does not claim to know the hidden exam.</p></section></div><section class="scope-list"><h2>What each conclusion says to prepare</h2>${TOPICS.map(t=>`<article><h3>Module ${t.id}: ${t.name}</h3><p>${['Environment characteristics and agent structures. The first two explorations are excluded. You need to apply the dimensions, not recite a memorized list.','Quiz 2 concepts and high-level Assignment 1 concepts. Compare completeness, optimality, time, and memory qualitatively. No complexity-formula memorization.','Concepts corresponding to Quiz 3. Compare algorithm performance qualitatively; no complexity-formula memorization.','Quiz 4 concepts. Apply minimax and alpha-beta to game trees; do not write the algorithms.','Apply AC-3 and backtracking to CSPs; do not write the algorithms.'][t.id-1]}</p><a href="https://canvas.oregonstate.edu/courses/2079176/pages/${t.conclusion}" target="_blank" rel="noopener">Module ${t.id} conclusion</a></article>`).join('')}</section><section class="research-note"><h2>What the broader research adds</h2><p>Public searches covered recent Oregon State CS 331 offerings and Nauman Chaudhry’s section. No dependable recent same-instructor exam account or released exam was found. Reports from other instructors describe different exam rules, so they do not override this Canvas course.</p><p>The official <a href="https://classes.engr.oregonstate.edu/eecs/" target="_blank" rel="noopener">Fall 2026 EECS listing</a> distinguishes the sections taught by Chaudhry, Saisubramanian, and Donnelly. Berkeley’s <a href="https://inst.eecs.berkeley.edu/~cs188/textbook/search/informed.html" target="_blank" rel="noopener">informed-search</a> and <a href="https://inst.eecs.berkeley.edu/~cs188/textbook/csp/filtering.html" target="_blank" rel="noopener">CSP filtering</a> notes were used to cross-check concepts, not infer what this exam will ask.</p><p>Quiz questions that originally ask for written responses are converted to the exam’s objective formats. A few ambiguous phrasings are made explicit; each is identified in its source note. Equivalent practice changes values or scenarios while retaining the same operations and problem scale.</p></section>`);}
function go(p){page=p;({home,notes,bank:bankPage,progress:progressPage,info,session:renderQuestion,summary}[p]??home)();window.scrollTo({top:0,behavior:'auto'});$('#main h1')?.focus({preventScroll:true});}
function start(kind='practice',t=topic){session=createSession(BANK,progress,{kind,topic:kind==='exam'||kind==='canvas'?0:t});save();renderQuestion();$('#questionTitle')?.focus({preventScroll:true});window.scrollTo(0,0);}
function current(){return byId.get(session.ids[session.index]);}
function check(){if(!session||session.finished||session.kind==='exam')return;const q=current();if(!answered(q,session.answers[q.id])||session.checked[q.id])return;session.checked[q.id]=true;record(progress,q,session.answers[q.id],{key:`${session.id}:${q.id}`});save();renderQuestion();$('#feedbackTitle')?.focus({preventScroll:true});$('#announcer').textContent=grade(q,session.answers[q.id]).correct?'Correct answer.':'Review the explanation.';}
function next(){
 if(!session)return;
 if(session.kind!=='exam'){
  if(!advancePracticeSession(session,BANK,progress))return;
  save();renderQuestion();$('#questionTitle')?.focus({preventScroll:true});
 }else if(session.index===session.ids.length-1)askFinish();
 else{session.index++;save();renderQuestion();$('#questionTitle')?.focus({preventScroll:true});}
 window.scrollTo(0,0);
}
function askFinish(){const s=summarize(session,BANK);$('#finishText').textContent=`${s.complete} of ${s.total} questions answered.${s.complete<s.total?` ${s.total-s.complete} unanswered questions will count as incorrect.`:''} You can review every explanation afterward.`;$('#finishDialog').showModal();}
function finish(){finishSession(session,BANK,progress);save();summary();window.scrollTo(0,0);$('#main h1')?.focus();}
function tick(){if(!session||session.finished||session.kind!=='exam')return;const left=Math.max(0,session.deadline-Date.now());if(left===0){finish();return;}const n=$('#clock');if(n){const sec=Math.ceil(left/1000);n.textContent=`${Math.floor(sec/60)}:${String(sec%60).padStart(2,'0')} left`;n.classList.toggle('urgent',left<300000);}}
setInterval(tick,1000);
let pendingImport=null;
document.addEventListener('click',ev=>{const b=ev.target.closest('button');if(!b)return;if(b.dataset.page)return go(b.dataset.page);if(b.dataset.topic!==undefined){topic=Number(b.dataset.topic);return page==='bank'?bankPage():home();}if(b.dataset.note){noteTopic=Number(b.dataset.note);return notes();}if(b.dataset.learnTopic){noteTopic=Number(b.dataset.learnTopic);return go('notes');}if(b.dataset.startTopic)return start('practice',Number(b.dataset.startTopic));if(b.dataset.jump!==undefined){session.index=Number(b.dataset.jump);save();renderQuestion();return $('#questionTitle')?.focus();}switch(b.dataset.action){case'practice':return start();case'canvas':return start('canvas');case'exam':return start('exam');case'resume':return go('session');case'check':return check();case'next':return next();case'prev':session.index=Math.max(0,session.index-1);save();renderQuestion();return $('#questionTitle')?.focus();case'flag':session.flags[current().id]=!session.flags[current().id];save();renderQuestion();return $('.flag')?.focus();case'finish':return askFinish();case'finish-confirm':$('#finishDialog').close();return finish();case'export':{const blob=new Blob([JSON.stringify(progress,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`cs331-progress-${new Date().toISOString().slice(0,10)}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);return;}case'import-cancel':pendingImport=null;$('#importDialog').close();return;case'import-confirm':progress=pendingImport;pendingImport=null;session=null;save();$('#importDialog').close();progressPage();$('#importStatus').textContent='Progress imported.';return;}});
document.addEventListener('change',async ev=>{const input=ev.target;if(input.id==='showVariants'){bankVariant=input.checked;$('#bankList').innerHTML=bankItems();return;}if(input.id==='importFile'){try{const f=input.files[0];if(!f)return;if(f.size>5000000)throw Error('Choose a progress backup smaller than 5 MB.');pendingImport=validateBackup(JSON.parse(await f.text()),BANK);$('#importDialog').showModal();}catch(e){$('#importStatus').textContent=e.message||'The backup could not be read.';}return;}if(page!=='session'||session.finished)return;const q=current();if(session.checked[q.id]&&session.kind!=='exam')return;if(input.dataset.pair!==undefined){const a=session.answers[q.id]??Array(q.pairs.length).fill('');a[Number(input.dataset.pair)]=input.value;session.answers[q.id]=a;}else if(input.id==='numericAnswer'){session.answers[q.id]=input.value;}else if(input.name==='answer'){if(q.kind==='multi'){session.answers[q.id]=Array.from(document.querySelectorAll('input[name="answer"]:checked')).map(i=>Number(i.value));}else session.answers[q.id]=Number(input.value);for(const label of document.querySelectorAll('.answer'))label.classList.toggle('selected',label.querySelector('input').checked);}else return;save();if(session.kind!=='exam'&&q.kind!=='multi'&&answered(q,session.answers[q.id]))return check();const checkButton=$('[data-action="check"]');if(checkButton)checkButton.disabled=!answered(q,session.answers[q.id]);});
document.addEventListener('input',ev=>{if(ev.target.id==='numericAnswer'&&session&&!session.finished&&!session.checked[current().id]){session.answers[current().id]=ev.target.value;save();const b=$('[data-action="check"]');if(b)b.disabled=!answered(current(),ev.target.value);}if(ev.target.id==='bankSearch'){search=ev.target.value;$('#bankList').innerHTML=bankItems();}});
document.addEventListener('keydown',ev=>{if(ev.key==='Enter'&&ev.target.id==='numericAnswer'&&page==='session'&&session&&!session.finished&&session.kind!=='exam'&&!ev.isComposing&&!ev.repeat&&!ev.ctrlKey&&!ev.metaKey&&!ev.altKey){ev.preventDefault();return check();}if(page!=='session'||!session||session.finished||ev.isComposing||ev.repeat||ev.ctrlKey||ev.metaKey||ev.altKey||ev.target.closest('input,select,textarea,button,a,[contenteditable="true"]')||document.querySelector('dialog[open]'))return;const q=current();if(/^[1-9]$/.test(ev.key)&&q.kind!=='match'&&q.kind!=='number'&&!session.checked[q.id]){const order=optionOrder(q,session.seed+session.index*97),i=order[Number(ev.key)-1],input=$(`#answer-${i}`);if(input){input.checked=!input.checked||q.kind==='single';input.dispatchEvent(new Event('change',{bubbles:true}));ev.preventDefault();}}if(ev.key==='Enter'&&session.kind!=='exam'){ev.preventDefault();session.checked[q.id]?next():check();}});
const requestedTopic=Number(new URLSearchParams(location.search).get('module'));
if(Number.isInteger(requestedTopic)&&requestedTopic>=1&&requestedTopic<=5)topic=requestedTopic;
save();home();
</script></body></html>
