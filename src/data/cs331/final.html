<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#1b2b43">
    <meta name="robots" content="noindex,nofollow">
    <meta name="description" content="Practice logical agents, first-order logic, probability, Bayesian networks, and AI ethics for the CS 331 final.">
    <title>CS 331 · Final Lab</title>
    <style>:root {
  font-family: 'Avenir Next', Avenir, 'Segoe UI', sans-serif;
  color: #1b2b43;
  background: #f1f5fa;
  font-size: 16px;
  line-height: 1.55;
  --blue: #245fb7;
  --ink: #1b2b43;
  --muted: #59677b;
  --line: #d8e1ec;
  --paper: #fff;
  --green: #17684a;
  --red: #a13c41;
}
* {
  box-sizing: border-box;
}
body {
  margin: 0;
}
button,
input,
select {
  font: inherit;
}
button,
a,
select,
input {
  touch-action: manipulation;
}
button,
.button {
  cursor: pointer;
  min-height: 44px;
}
button {
  border: 0;
  background: none;
  color: inherit;
}
button:disabled {
  opacity: 0.45;
  cursor: default;
}
a {
  color: #1858a7;
  text-underline-offset: 3px;
}
button:focus-visible,
a:focus-visible,
input:focus-visible,
select:focus-visible,
summary:focus-visible,
[tabindex='0']:focus-visible {
  outline: 3px solid #e99d26;
  outline-offset: 4px;
}
h1,
h2,
h3,
p {
  margin-top: 0;
}
h1 {
  font-size: clamp(2rem, 4.7vw, 3.9rem);
  line-height: 1.08;
  letter-spacing: -0.045em;
  font-weight: 650;
  margin-bottom: 22px;
}
h2 {
  font-size: 1.35rem;
  line-height: 1.3;
  letter-spacing: -0.02em;
  margin-bottom: 12px;
}
h3 {
  font-size: 1.12rem;
}
p {
  margin-bottom: 18px;
}
small,
.small {
  font-size: 0.85rem;
}
.quiet {
  color: var(--muted);
  font-size: 0.9rem;
}
.sr {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip-path: inset(50%);
  white-space: nowrap;
  border: 0;
}
.skip {
  position: fixed;
  top: -80px;
  left: 20px;
  z-index: 20;
  padding: 12px 20px;
  background: #fff;
}
.skip:focus {
  top: 12px;
}
header {
  max-width: 1260px;
  margin: auto;
  min-height: 104px;
  display: flex;
  align-items: center;
  gap: 40px;
  padding: 16px 38px;
  border-bottom: 1px solid var(--line);
}
.brand {
  display: flex;
  align-items: center;
  gap: 13px;
  text-align: left;
  padding: 0;
}
.brand svg {
  width: 35px;
  height: 35px;
  color: var(--blue);
}
.brand > span {
  font-size: 1.25rem;
  font-weight: 700;
  letter-spacing: -0.035em;
}
.brand small {
  display: block;
  color: var(--muted);
  font-weight: 500;
  letter-spacing: 0;
  font-size: 0.73rem;
  margin-top: 1px;
}
header nav {
  display: flex;
  gap: 10px;
  margin-left: auto;
}
header nav button {
  padding: 8px 15px;
  border-radius: 8px;
  font-size: 0.93rem;
  color: var(--muted);
}
header nav button[aria-current] {
  background: #e2ebf8;
  color: #164d99;
  font-weight: 650;
}
.exam-link {
  font-size: 0.9rem;
  white-space: nowrap;
  display: flex;
  gap: 14px;
  align-items: center;
}
.exam-link span {
  font-size: 1.3rem;
  color: var(--blue);
}
main {
  max-width: 1184px;
  margin: auto;
  padding: 36px 0 80px;
  min-height: calc(100vh - 190px);
}
main:focus {
  outline: none;
}
footer {
  max-width: 1184px;
  margin: auto;
  display: flex;
  justify-content: space-between;
  gap: 28px;
  border-top: 1px solid var(--line);
  padding: 20px 0 28px;
  color: var(--muted);
  font-size: 0.76rem;
}
.course-line {
  color: #486078;
  font-size: 0.93rem;
  margin-bottom: 18px;
}
.home-intro {
  display: grid;
  grid-template-columns: 1.05fr 0.95fr;
  align-items: center;
  gap: 48px;
  padding: 24px 0 36px;
}
.intro-copy {
  font-size: 1.1rem;
  max-width: 46ch;
  color: #52647c;
  margin-bottom: 0;
}
.intro-diagram {
  background: #e6eef8;
  border-radius: 50% 10px 10px 10px;
  padding: 30px 26px 0;
}
.diagram-heading {
  display: block;
  text-align: right;
  padding-right: 28px;
  color: #44617f;
  font-size: 0.88rem;
}
.intro-diagram svg {
  width: 100%;
  display: block;
  opacity: 0.85;
}
.home-grid {
  display: grid;
  grid-template-columns: 1.6fr 1fr;
  gap: 28px;
  margin-bottom: 48px;
}
.practice-panel {
  background: var(--ink);
  color: #fff;
  border-radius: 16px;
  padding: 28px 32px 14px;
}
.panel-heading {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 20px;
}
.panel-heading h2 {
  margin-bottom: 9px;
}
.practice-panel .quiet {
  color: #c1cde0;
}
.practice-panel > p {
  color: #c7d3e5;
  font-size: 0.95rem;
}
.topic-buttons {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin: 20px 0 24px;
}
.topic-buttons button {
  font-size: 0.85rem;
  padding: 8px 13px;
  border: 1px solid #3f526e;
  border-radius: 7px;
  min-height: 40px;
  color: #d6e1f2;
}
.topic-buttons button[aria-pressed='true'] {
  background: white;
  color: #1a375e;
  border-color: white;
  font-weight: 650;
}
.primary,
.secondary,
.button {
  display: inline-flex;
  justify-content: center;
  align-items: center;
  gap: 18px;
  min-height: 46px;
  padding: 11px 19px;
  border-radius: 8px;
  text-decoration: none;
  font-size: 0.95rem;
  font-weight: 650;
}
.primary {
  background: var(--blue);
  color: #fff;
  border: 1px solid var(--blue);
}
.primary:hover:not(:disabled) {
  background: #164d99;
}
.secondary {
  background: #fff;
  border: 1px solid #bfccdc;
  color: var(--ink);
}
.secondary:hover:not(:disabled) {
  background: #edf2f8;
}
.start {
  background: #f2b45a;
  color: #172c48;
  border-color: #f2b45a;
  justify-content: space-between;
  min-width: 235px;
  margin-bottom: 20px;
}
.start:hover:not(:disabled) {
  background: #f6c77d;
}
.start span {
  font-size: 1.3rem;
}
.other-modes {
  border-top: 1px solid #3a4b63;
}
.other-modes > button {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 17px;
  text-align: left;
  padding: 19px 0;
  border-bottom: 1px solid #3a4b63;
}
.other-modes > button:last-child {
  border: 0;
}
.other-modes small {
  display: block;
  color: #b9c8dd;
  font-weight: 400;
  font-size: 0.81rem;
}
.other-modes strong {
  font-size: 0.97rem;
}
.mode-icon {
  font-size: 1.5rem;
  color: #b7cce8;
  width: 20px;
}
.other-modes > button > span:last-child {
  margin-left: auto;
  font-size: 1.4rem;
}
.exam-brief {
  padding: 27px 32px;
  background: #fff;
  border: 1px solid var(--line);
  border-radius: 12px;
}
.exam-brief h2 {
  font-size: 1.07rem;
}
.date {
  font-size: 2rem;
  font-weight: 650;
  letter-spacing: -0.04em;
  line-height: 1.3;
  margin-bottom: 20px;
}
dl {
  margin: 0 0 18px;
}
dl > div {
  display: grid;
  grid-template-columns: 85px 1fr;
  gap: 12px;
  padding: 8px 0;
}
dt {
  color: var(--muted);
  font-size: 0.86rem;
}
dd {
  margin: 0;
  font-size: 0.93rem;
  font-weight: 550;
}
.exam-brief > p:not(.date) {
  font-size: 0.86rem;
  color: var(--muted);
  margin-bottom: 8px;
}
.text-button {
  color: #1858a7;
  text-align: left;
  font-size: 0.88rem;
  padding: 6px 0;
  text-decoration: underline;
  text-underline-offset: 4px;
}
.module-list {
  margin-top: 17px;
  border-top: 1px solid var(--line);
}
.module-row {
  display: flex;
  align-items: center;
  width: 100%;
  gap: 20px;
  text-align: left;
  padding: 20px 4px;
  border-bottom: 1px solid var(--line);
}
.module-row:hover {
  background: #e9f0f9;
}
.module-dot {
  width: 38px;
  height: 38px;
  flex: none;
  border-radius: 50%;
  display: grid;
  place-items: center;
  background: color-mix(in srgb, var(--topic) 12%, white);
  color: var(--topic);
  font-weight: 700;
}
.module-title strong {
  font-size: 1rem;
  font-weight: 650;
}
.module-title small {
  display: block;
  color: var(--muted);
  margin-top: 2px;
}
.module-coverage {
  margin-left: auto;
  min-width: 132px;
  font-size: 0.77rem;
  color: var(--muted);
}
progress {
  accent-color: var(--blue);
  height: 6px;
  border: 0;
  border-radius: 4px;
  overflow: hidden;
  background: #dce4ee;
}
progress::-webkit-progress-bar {
  background: #dce4ee;
}
progress::-webkit-progress-value {
  background: var(--blue);
  border-radius: 4px;
}
progress::-moz-progress-bar {
  background: var(--blue);
}
.module-coverage progress {
  display: block;
  width: 100%;
  margin-top: 8px;
}
.chevron {
  font-size: 1.7rem;
  color: #6b7f99;
}
.resume {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  background: #e0ebf9;
  border: 1px solid #c8d9ee;
  padding: 17px 22px;
  border-radius: 10px;
  margin-bottom: 24px;
}
.resume span {
  display: block;
  font-size: 0.88rem;
  color: #486078;
}
.session-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  margin-bottom: 17px;
  font-size: 0.9rem;
}
.session-progress {
  display: block;
  width: 100%;
  margin-bottom: 30px;
}
.clock {
  font-variant-numeric: tabular-nums;
  background: #e2ebf8;
  color: #194e94;
  padding: 7px 13px;
  border-radius: 6px;
  font-weight: 650;
}
.clock.urgent {
  background: #f9dfe1;
  color: #912c34;
}
.question-layout {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 225px;
  gap: 40px;
  align-items: start;
}
.question-card {
  background: #fff;
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 32px 36px;
}
.question-meta {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 14px;
  margin-bottom: 25px;
}
.topic-tag {
  font-size: 0.77rem;
  font-weight: 650;
  color: var(--topic, #245fb7);
  display: inline-block;
}
.question-card h1 {
  font-size: 1.5rem;
  letter-spacing: -0.02em;
  line-height: 1.5;
  font-weight: 600;
  margin-bottom: 26px;
  max-width: 70ch;
}
.question-card h1:focus,
.feedback h2:focus {
  outline: none;
}
.question-meta .quiet {
  font-size: 0.77rem;
}
.problem-figure {
  margin: 0 0 27px;
  padding: 8px 10px 15px;
  background: #f5f8fc;
  border: 1px solid #dfe7f1;
  border-radius: 8px;
}
.problem-figure svg {
  display: block;
  width: 100%;
  min-width: 480px;
  max-height: 390px;
}
.diagram-scroll {
  overflow-x: auto;
}
.problem-figure figcaption {
  font-size: 0.78rem;
  color: #52647a;
  margin: 8px 8px 0;
}
.text-alternative {
  font-size: 0.77rem;
  color: #52647a;
  margin: 8px 8px 0;
}
.text-alternative p {
  margin: 10px 0 0;
}
.edge {
  fill: none;
  stroke: #839bb8;
  stroke-width: 2;
}
.max-node {
  fill: #3064ac;
}
.min-node {
  fill: #2b796d;
}
.node-text {
  font-size: 16px;
  text-anchor: middle;
  fill: white;
  font-weight: 600;
}
.leaf {
  fill: white;
  stroke: #9aafc9;
  stroke-width: 1.5;
}
.leaf-text {
  font-size: 17px;
  text-anchor: middle;
  fill: #243e61;
  font-weight: 600;
}
.leaf-label {
  font-size: 12px;
  fill: #617792;
  text-anchor: middle;
}
.pruned .leaf {
  fill: #f9e4e4;
  stroke: #c56f72;
}
.pruned .edge {
  stroke-dasharray: 5 4;
}
.prune-mark {
  stroke: #a5353d;
  stroke-width: 3;
}
.axis {
  stroke: #b9c8da;
  stroke-width: 1;
}
.land-line {
  stroke: #3064ac;
  stroke-width: 3;
}
fieldset {
  padding: 0;
  border: 0;
  margin: 0;
  min-width: 0;
}
fieldset:disabled {
  opacity: 1;
}
legend {
  font-size: 0.8rem;
  font-weight: 600;
  color: #617188;
  margin-bottom: 12px;
  padding: 0;
}
.answers {
  display: grid;
  gap: 10px;
}
.answer {
  border: 1px solid #cbd7e5;
  padding: 15px;
  display: flex;
  align-items: center;
  gap: 13px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 0.96rem;
  line-height: 1.5;
  position: relative;
  min-height: 58px;
}
.answer input {
  position: absolute;
  inset: 0;
  opacity: 0;
  width: 100%;
  height: 100%;
  margin: 0;
  cursor: pointer;
}
.answer:has(input:focus-visible) {
  outline: 3px solid #e99d26;
  outline-offset: 3px;
}
.answer-letter {
  border: 1px solid #c7d4e4;
  min-width: 27px;
  height: 28px;
  border-radius: 5px;
  display: grid;
  place-items: center;
  font-size: 0.76rem;
  color: #52677f;
}
.answer.selected {
  background: #edf3fd;
  border-color: #4f7ebc;
  box-shadow: inset 0 0 0 1px #4f7ebc;
}
.answer.selected .answer-letter {
  background: #245fb7;
  color: #fff;
  border-color: #245fb7;
}
.answer-correct {
  background: #ecf6ef !important;
  border-color: #5b9274 !important;
  box-shadow: none !important;
}
.answer-wrong {
  background: #fcf0f0 !important;
  border-color: #bc777a !important;
  box-shadow: none !important;
}
.answer-mark {
  margin-left: auto;
  color: #17684a;
  font-weight: 700;
}
.match-row {
  display: grid;
  grid-template-columns: 1fr 1.4fr;
  align-items: center;
  gap: 20px;
  border-bottom: 1px solid var(--line);
  padding: 14px 0;
  font-size: 0.91rem;
}
.match-row label {
  font-weight: 550;
}
.match-row select {
  width: 100%;
  border: 1px solid #c1cfe0;
  min-height: 46px;
  border-radius: 7px;
  background: white;
  color: var(--ink);
  padding: 9px 30px 9px 12px;
  font-size: 0.9rem;
}
.match-row select:disabled {
  opacity: 1;
  color: #455870;
}
.question-actions {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 16px;
  margin-top: 30px;
  padding-top: 24px;
  border-top: 1px solid var(--line);
}
.key-help {
  font-size: 0.75rem;
  color: #65758a;
}
.session-aside {
  padding-top: 20px;
  font-size: 0.88rem;
  color: var(--muted);
}
.session-aside h2 {
  color: #243e61;
  font-size: 1.05rem;
}
.session-aside p {
  line-height: 1.65;
}
.question-source {
  margin-top: 24px;
  padding-top: 20px;
  border-top: 1px solid var(--line);
  font-size: 0.8rem;
}
.question-source p {
  margin: 12px 0;
}
.feedback {
  margin-top: 27px;
  padding: 22px 24px;
  background: #f0f6f1;
  border-left: 4px solid #538568;
  border-radius: 0 8px 8px 0;
}
.feedback.review {
  background: #f9f2e8;
  border-color: #bb832f;
}
.feedback h2 {
  font-size: 1.15rem;
}
.feedback p,
.feedback li {
  font-size: 0.94rem;
}
.feedback p:last-child {
  margin-bottom: 0;
}
.feedback a {
  font-size: 0.8rem;
}
.feedback ol {
  padding-left: 22px;
}
.source-note {
  font-size: 0.8rem !important;
  color: #66758a;
}
.question-map {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 6px;
  margin-bottom: 20px;
}
.question-map button {
  border: 1px solid #bfcde0;
  background: white;
  min-height: 36px;
  border-radius: 6px;
  font-size: 0.8rem;
  position: relative;
}
.question-map .done {
  background: #dce9f8;
  color: #224f8d;
}
.question-map .current {
  outline: 2px solid #3064ac;
  outline-offset: 1px;
}
.question-map button span {
  position: absolute;
  right: 3px;
  top: -2px;
  color: #a15b2e;
}
.wide {
  width: 100%;
}
.page-heading {
  max-width: 800px;
  padding: 18px 0 27px;
}
.page-heading h1 {
  font-size: clamp(2rem, 4vw, 3.2rem);
}
.page-heading > p:last-child {
  font-size: 1.02rem;
  color: var(--muted);
}
.learn-layout {
  display: grid;
  grid-template-columns: 235px minmax(0, 1fr);
  gap: 48px;
}
.lesson-nav {
  display: flex;
  flex-direction: column;
  gap: 9px;
}
.lesson-nav button {
  display: flex;
  gap: 12px;
  text-align: left;
  border-radius: 8px;
  padding: 13px;
  font-size: 0.88rem;
  color: var(--muted);
  line-height: 1.45;
}
.lesson-nav button span {
  font-size: 0.78rem;
  min-width: 23px;
  margin-top: 2px;
}
.lesson-nav [aria-current] {
  color: #174d98;
  background: #e0eafa;
  font-weight: 650;
}
.lesson {
  background: #fff;
  border: 1px solid var(--line);
  padding: 35px 40px;
  border-radius: 12px;
  max-width: 840px;
}
.lesson h2 {
  font-size: 1.85rem;
  margin: 13px 0 24px;
  line-height: 1.3;
}
.lesson p {
  line-height: 1.8;
  font-size: 0.98rem;
}
.scope-note {
  color: #566a82;
  font-size: 0.85rem !important;
  background: #eef3f9;
  padding: 15px 18px;
  border-radius: 6px;
}
.lesson table {
  font-size: 0.83rem;
  width: 100%;
  border-collapse: collapse;
  margin: 25px 0;
}
.lesson th,
.lesson td {
  text-align: left;
  vertical-align: top;
  padding: 11px;
  border-bottom: 1px solid var(--line);
}
.lesson th {
  font-weight: 650;
}
.lesson caption {
  text-align: left;
  font-weight: 650;
  font-size: 0.93rem;
  padding-bottom: 10px;
}
.actions {
  display: flex;
  align-items: center;
  gap: 14px;
  flex-wrap: wrap;
}
.lesson .actions {
  margin-top: 30px;
}
.lesson .actions a {
  font-size: 0.83rem;
}
.bank-toolbar {
  background: #e6edf7;
  border-radius: 10px;
  padding: 1px 22px 21px;
  margin-bottom: 25px;
}
.bank-toolbar .topic-buttons button {
  color: #455b76;
  border-color: #acbdd4;
}
.bank-toolbar .topic-buttons [aria-pressed='true'] {
  color: #fff;
  background: #245fb7;
  border-color: #245fb7;
}
.bank-search {
  display: flex;
  align-items: center;
  gap: 14px;
  flex-wrap: wrap;
}
.bank-search > label:first-child {
  font-size: 0.86rem;
  font-weight: 600;
}
.bank-search input[type='search'] {
  min-height: 42px;
  max-width: 350px;
  flex: 1;
  min-width: 160px;
  border: 1px solid #b6c7db;
  border-radius: 7px;
  padding: 9px 12px;
  background: #fff;
}
.check-line {
  font-size: 0.83rem;
  display: flex;

  let x = seed >>> 0;

    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

}

function answered(q, a) {

      a.length === q.pairs.length &&
      a.every((x) => typeof x === 'string' && x.length > 0)

function record(progress, q, answer, { key, at = Date.now() } = {}) {

function selectQuestions(
  bank,
  progress,
  { kind = 'practice', topic = 0, seed = 1 } = {}
) {
  const r = rng(seed),
    filtered = bank.filter((q) => !topic || q.module === topic);
  const modules = [...new Set(filtered.map((q) => q.module))],
    count = kind === 'exam' ? DRILL.questions : 10,
    picked = [];
  // Rotate through the modules before filling any slots left by a short topic.
  for (let i = 0; i < count; i++) {
    const m = modules[i % modules.length];
    let candidates = filtered.filter(
      (q) => q.module === m && !picked.includes(q.id)
    );
    if (!candidates.length)
      candidates = filtered.filter((q) => !picked.includes(q.id));
    if (!candidates.length) break;
    if (kind === 'exam') {
      picked.push(candidates[Math.floor(r() * candidates.length)].id);
    } else {
      const ranked = candidates
        .map((q) => {
          const s = progress.stats[q.id];
          const base = !s ? 5 : !s.lastCorrect ? 7 : s.streak < 2 ? 2 : 0;

function createSession(bank, progress, options = {}) {

    seed = options.seed ?? now >>> 0;

    id: `${now}-${seed}`,
    kind: options.kind ?? 'practice',
    topic: options.topic ?? 0,
    ids: selectQuestions(bank, progress, { ...options, seed }),
    index: 0,
    questionOffset: 0,
    answers: {},
    checked: {},

function advancePracticeSession(session, bank, progress) {
  if (
    session.kind === 'exam' ||
    session.finished ||
    !session.checked[session.ids[session.index]]

    return false;
  if (session.index < session.ids.length - 1) {
    session.index++;
    return true;
  }
  // Refill a bounded queue without interrupting practice or growing saved state.
  const previous = session.ids[session.index];
  session.questionOffset =
    (Number.isSafeInteger(session.questionOffset)
      ? session.questionOffset
      : 0) + session.ids.length;
  session.seed = (session.seed + 0x9e3779b9) >>> 0;
  session.ids = selectQuestions(bank, progress, {
    kind: session.kind,
    topic: session.topic,
    seed: session.seed,
  });
  if (session.ids[0] === previous && session.ids.length > 1)
    session.ids.push(session.ids.shift());

function finishSession(s, bank, progress, at = Date.now()) {
  if (s.finished) return;

}
function summarize(s, bank) {
  let right = 0,
    score = 0,
    complete = 0;
  for (const id of s.ids) {
    const q = bank.find((q) => q.id === id);
    if (!q) continue;
    const a = s.answers[id],
      g = grade(q, a);
    right += Number(g.correct);
    score += g.score;

function validateBackup(value, bank) {
  if (
    !value ||
    value.type !== BACKUP_TYPE ||
    value.schema !== SCHEMA ||
    !value.stats ||
    !Array.isArray(value.attempts)
  )
    throw Error('Choose a CS 331 Final Lab progress backup.');
  const ids = new Set(bank.map((q) => q.id)),
    p = emptyProgress();
  for (const [id, s] of Object.entries(value.stats)) {
    if (!ids.has(id)) continue;
    if (
      !s ||
      !['seen', 'correct', 'streak', 'lastAt'].every(
        (k) => Number.isFinite(s[k]) && s[k] >= 0
      ) ||
      s.correct > s.seen ||
      s.streak > s.correct
    )
      throw Error('The progress backup has invalid counts.');
    p.stats[id] = {
      seen: s.seen,
      correct: s.correct,
      streak: s.streak,
      lastAt: s.lastAt,
      lastCorrect: !!s.lastCorrect,
    };
  }
  p.attempts = value.attempts
    .filter(
      (a) =>
        a &&
        ids.has(a.id) &&
        typeof a.key === 'string' &&
        typeof a.correct === 'boolean' &&
        Number.isFinite(a.at)
    )
    .slice(-1500)
    .map((a) => ({
      key: a.key,
      id: a.id,
      module: bank.find((q) => q.id === a.id).module,
      correct: a.correct,
      score: Number.isFinite(a.score)
        ? Math.max(0, Math.min(1, a.score))
        : Number(a.correct),
      at: a.at,
    }));
  return p;
}

      </summary>
      <div class="review-body">
        <p><strong>Your answer:</strong> ${esc(answerDescription(question, answer))}</p>
        ${result.correct ? '' : `<p><strong>Correct answer:</strong> ${esc(correctDescription(question))}</p>`}
        ${diagram(question)}
        <p>${esc(question.why)}</p>
      </div>
    </details>`;
    })
    .join('');
  shell(`<section class="summary-head">
    <p class="course-line">Timed drill complete</p>
    ${heading(`${right} of ${total} correct`)}
    <p>${complete} of ${total} answered. Open any question below to review the reasoning.</p>
    <div class="actions">
      <button class="primary" data-action="practice">Keep practicing</button>
      <button class="secondary" data-page="progress">View progress</button>
    </div>
  </section>
  <section class="review-list"><h2>Answer review</h2>${review}</section>`);
}

function notes() {
  const lesson = LESSONS.find((entry) => entry.module === noteTopic);
  const item = topicById.get(noteTopic);
  shell(`<div class="page-heading">${heading('Module notes')}</div>
    <div class="learn-layout">
      <nav class="lesson-nav" aria-label="Module notes">
        ${TOPICS.map((t) => `<button data-note="${t.id}" ${noteTopic === t.id ? 'aria-current="page"' : ''}><span>${t.id}</span>${t.name}</button>`).join('')}
      </nav>
      <article class="lesson">
        <span class="topic-tag" style="--topic:${item.color}">Module ${item.id} · ${item.short}</span>
        <h2>${lesson.title}</h2>
        ${lesson.sections.map(([title, body]) => `<section><h3>${esc(title)}</h3><p>${esc(body)}</p></section>`).join('')}
        <div class="actions"><button class="primary" data-start-topic="${item.id}">Practice this module</button>${sourceLink(item.id)}</div>
      </article>
    </div>`);
}

function questionType(q) {
  if (q.kind === 'number') return 'Numeric';
  if (q.kind === 'match') return 'Matching';
  if (q.kind === 'multi') return 'Select all';
  return q.options.join('|') === 'True|False'
    ? 'True / False'
    : 'Multiple choice';
}

function bankItems() {
  const query = search.trim().toLowerCase();
  const list = BANK.filter(
    (q) =>
      (!topic || q.module === topic) &&
      `${q.prompt} ${q.why}`.toLowerCase().includes(query)
  );
  if (!list.length)
    return '<p>No questions match. Try a different module or search.</p>';
  return (
    `<p class="quiet">${list.length} ${list.length === 1 ? 'question' : 'questions'}</p>` +
    list
      .map((q) => {
        const choices =
          q.kind === 'match' ? q.pairs.map((pair) => pair[0]) : q.options;
        return `<details class="bank-item">
      <summary><span class="topic-tag" style="--topic:${topicById.get(q.module).color}">Module ${q.module}</span>
      <span>${esc(q.prompt)}</span><span class="bank-kind">${questionType(q)}</span></summary>
      <div class="bank-body">
        ${diagram(q)}
        ${choices ? `<ul>${choices.map((value) => `<li>${esc(value)}</li>`).join('')}</ul>` : ''}
        <details class="solution"><summary>Show answer and reasoning</summary><p><strong>${esc(correctDescription(q))}</strong></p><p>${esc(q.why)}</p></details>
      </div>
    </details>`;
      })
      .join('')
  );
}

function bankPage() {
  shell(`<div class="page-heading">${heading('Question library')}</div>
    <section class="bank-toolbar">
      ${topicButtons(topic)}
      <div class="bank-search">
        <label for="bankSearch">Search questions</label>
        <input id="bankSearch" type="search" value="${esc(search)}" placeholder="Search a concept or question">
      </div>
    </section>
    <div id="bankList">${bankItems()}</div>`);
}

function progressPage() {
  const attempts = progress.attempts;
  const seen = BANK.filter((q) => progress.stats[q.id]).length;
  const right = attempts.filter((attempt) => attempt.correct).length;
  const rows = TOPICS.map((t) => {
    const bank = BANK.filter((q) => q.module === t.id);
    const count = bank.filter((q) => progress.stats[q.id]).length;
    const missed = bank.filter(
      (q) => progress.stats[q.id]?.lastCorrect === false
    ).length;
    const recent = attempts
      .filter((attempt) => attempt.module === t.id)
      .slice(-20);
    const accuracy = recent.length
      ? Math.round(
          (100 * recent.filter((attempt) => attempt.correct).length) /
            recent.length
        ) + '%'
      : '—';
    return `<tr><th scope="row">${t.id}. ${t.name}</th><td>${count} / ${bank.length}</td>
      <td>${accuracy}<small>${recent.length ? `Last ${recent.length} answers` : 'No answers yet'}</small></td>
      <td>${missed}</td><td><button class="secondary" data-start-topic="${t.id}" aria-label="Practice ${t.name}">Practice</button></td></tr>`;
  }).join('');
  shell(`<div class="page-heading">${heading('Study progress')}</div>
    <section class="stat-strip">
      <div><strong>${seen}<span> / ${BANK.length}</span></strong><span>Questions answered</span></div>
      <div><strong>${attempts.length}</strong><span>Recorded answers</span></div>
      <div><strong>${attempts.length ? Math.round((right / attempts.length) * 100) + '%' : '—'}</strong><span>Answer accuracy</span></div>
    </section>
    <section class="progress-table-wrap"><table class="progress-table">
      <caption>Progress by module</caption>
      <thead><tr><th scope="col">Module</th><th scope="col">Coverage</th><th scope="col">Recent accuracy</th><th scope="col">Needs review</th><th scope="col">Practice</th></tr></thead>
      <tbody>${rows}</tbody>
    </table></section>
    <section class="backup-panel">
      <div><h2>Move progress between browsers</h2><p>Importing replaces the study history in this browser.</p></div>
      <div class="actions">
        <button class="secondary" data-action="export">Export progress</button>
        <button class="secondary" data-action="import">Import progress</button>
        <input id="importFile" type="file" accept="application/json,.json" hidden>
        <p id="importStatus" class="small" role="status"></p>
      </div>
    </section>`);
}

function info() {
  shell(`<div class="page-heading">
    ${heading('Final exam scope')}
    <p>Based on Nauman Chaudhry’s module conclusions, checked ${SCOPE.checked}. The game uses original practice questions.</p>
  </div>
  <div class="info-grid">
    <section class="info-panel">
      <h2>Canvas schedule</h2>
      <dl><div><dt>Finals module opens</dt><dd>${SCOPE.unlocks}</dd></div>
        <div><dt>Due date shown</dt><dd>${SCOPE.due}</dd></div>
        <div><dt>Weight</dt><dd>20% of the course grade</dd></div>
        <div><dt>Proctoring</dt><dd>Remote</dd></div></dl>
      <a href="${SCOPE.modules}" target="_blank" rel="noopener">Open Canvas modules</a>
      <a href="${SCOPE.syllabus}" target="_blank" rel="noopener">Open the syllabus</a>
    </section>
    <section class="info-panel">
      <h2>Timed drill settings</h2>
      <p>The drill gives you ${DRILL.questions} questions in ${DRILL.minutes} minutes, with six questions per module. Answers and explanations appear after you finish.</p>
      <p>The Finals Module was locked when checked. Use Canvas for the actual exam duration and question format.</p>
    </section>
  </div>
  <section class="scope-list">
    <h2>What to review</h2>
    ${TOPICS.map(
      (t) => `<article><h3>Module ${t.id} · ${t.name}</h3><p>${t.scope}</p>
      ${sourceLink(t.id, 'Module ' + t.id + ' conclusion')}</article>`
    ).join('')}
  </section>`);
}

function go(p) {
  page = p;
  (
    ({
      home,
      notes,
      bank: bankPage,
      progress: progressPage,
      info,
      session: renderQuestion,
      summary,
    })[p] ?? home
  )();
  window.scrollTo({ top: 0, behavior: 'auto' });
  $('#main h1')?.focus({ preventScroll: true });
}
function start(kind = 'practice', t = topic) {
  session = createSession(BANK, progress, {
    kind,
    topic: kind === 'exam' ? 0 : t,
  });
  save();
  renderQuestion();
  $('#questionTitle')?.focus({ preventScroll: true });
  window.scrollTo(0, 0);
}
function current() {
  return byId.get(session.ids[session.index]);
}
function check() {
  if (!session || session.finished || session.kind === 'exam') return;
  const q = current();
  if (!answered(q, session.answers[q.id]) || session.checked[q.id]) return;
  session.checked[q.id] = true;
  record(progress, q, session.answers[q.id], { key: `${session.id}:${q.id}` });
  save();
  renderQuestion();
  $('#feedbackTitle')?.focus();
}
function next() {
  if (!session) return;
  if (session.kind !== 'exam') {
    if (!advancePracticeSession(session, BANK, progress)) return;
    save();
    renderQuestion();
    $('#questionTitle')?.focus({ preventScroll: true });
  } else if (session.index === session.ids.length - 1) askFinish();
  else {
    session.index++;
    save();
    renderQuestion();
    $('#questionTitle')?.focus({ preventScroll: true });
  }
  window.scrollTo(0, 0);
}
function askFinish() {
  const s = summarize(session, BANK);
  $('#finishText').textContent =
    `${s.complete} of ${s.total} questions answered.${s.complete < s.total ? ` ${s.total - s.complete} unanswered questions will count as incorrect.` : ''} You can review every explanation afterward.`;
  $('#finishDialog').showModal();
}
function finish() {
  finishSession(session, BANK, progress);
  save();
  summary();
  window.scrollTo(0, 0);
  $('#main h1')?.focus();
}
function tick() {
  if (!session || session.finished || session.kind !== 'exam') return;
  const left = Math.max(0, session.deadline - Date.now());
  if (left === 0) {
    finish();
    return;
  }
  const n = $('#clock');
  if (n) {
    const sec = Math.ceil(left / 1000);
    n.textContent = `${Math.floor(sec / 60)}:${String(sec % 60).padStart(2, '0')} left`;
    n.classList.toggle('urgent', left < 300000);
  }
}
setInterval(tick, 1000);
let pendingImport = null;
document.addEventListener('click', (ev) => {
  const b = ev.target.closest('button');
  if (!b) return;
  if (b.dataset.page) return go(b.dataset.page);
  if (b.dataset.topic !== undefined) {
    topic = Number(b.dataset.topic);
    return page === 'bank' ? bankPage() : home();
  }
  if (b.dataset.note) {
    noteTopic = Number(b.dataset.note);
    notes();
    return document.querySelector(`[data-note='${noteTopic}']`)?.focus();
  }
  if (b.dataset.learnTopic) {
    noteTopic = Number(b.dataset.learnTopic);
    return go('notes');
  }
  if (b.dataset.startTopic)
    return start('practice', Number(b.dataset.startTopic));
  if (b.dataset.jump !== undefined) {
    session.index = Number(b.dataset.jump);
    save();
    renderQuestion();
    return $('#questionTitle')?.focus();
  }
  switch (b.dataset.action) {
    case 'practice':
      return start();
    case 'exam':
      return start('exam');
    case 'resume':
      return go('session');
    case 'check':
      return check();
    case 'next':
      return next();
    case 'prev':
      session.index = Math.max(0, session.index - 1);
      save();
      renderQuestion();
      return $('#questionTitle')?.focus();
    case 'flag':
      session.flags[current().id] = !session.flags[current().id];
      save();
      renderQuestion();
      return $('.flag')?.focus();
    case 'finish':
      return askFinish();
    case 'finish-confirm':
      $('#finishDialog').close();
      return finish();
    case 'import':
      return $('#importFile').click();
    case 'export': {
      const blob = new Blob([JSON.stringify(progress, null, 2)], {
          type: 'application/json',
        }),
        url = URL.createObjectURL(blob),
        a = document.createElement('a');
      a.href = url;
      a.download = `cs331-final-progress-${new Date().toISOString().slice(0, 10)}.json`;
      a.click();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
      return;
    }
    case 'import-cancel':
      pendingImport = null;
      $('#importDialog').close();
      return;
    case 'import-confirm':
      progress = pendingImport;
      pendingImport = null;
      session = null;
      save();
      $('#importDialog').close();
      progressPage();
      $('#importStatus').textContent = 'Progress imported.';
      return;
  }
});
document.addEventListener('change', async (ev) => {
  const input = ev.target;
  if (input.id === 'importFile') {
    try {
      const f = input.files[0];
      if (!f) return;
      input.value = '';
      if (f.size > 5000000)
        throw Error('Choose a progress backup smaller than 5 MB.');
      pendingImport = validateBackup(JSON.parse(await f.text()), BANK);
      $('#importDialog').showModal();
    } catch (e) {
      $('#importStatus').textContent =
        e.message || 'The backup could not be read.';
    }
    return;
  }
  if (page !== 'session' || session.finished) return;
  const q = current();
  if (session.checked[q.id] && session.kind !== 'exam') return;
  if (input.dataset.pair !== undefined) {
    const a = session.answers[q.id] ?? Array(q.pairs.length).fill('');
    a[Number(input.dataset.pair)] = input.value;
    session.answers[q.id] = a;
  } else if (input.id === 'numericAnswer') {
    session.answers[q.id] = input.value;
  } else if (input.name === 'answer') {
    if (q.kind === 'multi') {
      session.answers[q.id] = Array.from(
        document.querySelectorAll('input[name="answer"]:checked')
      ).map((i) => Number(i.value));
    } else session.answers[q.id] = Number(input.value);
    for (const label of document.querySelectorAll('.answer'))
      label.classList.toggle('selected', label.querySelector('input').checked);
  } else return;
  save();
  if (session.kind === 'exam') updateDrillProgress();
  if (
    session.kind !== 'exam' &&
    q.kind !== 'multi' &&
    answered(q, session.answers[q.id])
  )
    return check();
  const checkButton = $('[data-action="check"]');
  if (checkButton) checkButton.disabled = !answered(q, session.answers[q.id]);
});
document.addEventListener('input', (ev) => {
  if (
    ev.target.id === 'numericAnswer' &&
    session &&
    !session.finished &&
    !session.checked[current().id]
  ) {
    session.answers[current().id] = ev.target.value;
    save();
    const b = $('[data-action="check"]');
    if (b) b.disabled = !answered(current(), ev.target.value);
  }
  if (ev.target.id === 'bankSearch') {
    search = ev.target.value;
    $('#bankList').innerHTML = bankItems();
  }
});
document.addEventListener('keydown', (ev) => {
  if (
    ev.key === 'Enter' &&
    ev.target.id === 'numericAnswer' &&
    page === 'session' &&
    session &&
    !session.finished &&
    session.kind !== 'exam' &&
    !ev.isComposing &&
    !ev.repeat &&
    !ev.ctrlKey &&
    !ev.metaKey &&
    !ev.altKey
  ) {
    ev.preventDefault();
    return check();
  }
  if (
    page !== 'session' ||
    !session ||
    session.finished ||
    ev.isComposing ||
    ev.repeat ||
    ev.ctrlKey ||
    ev.metaKey ||
    ev.altKey ||
    ev.target.closest(
      'input,select,textarea,button,a,[contenteditable="true"]'
    ) ||
    document.querySelector('dialog[open]')
  )
    return;
  const q = current();
  if (
    ev.target.id === 'questionTitle' &&
    /^[1-9]$/.test(ev.key) &&
    q.kind !== 'match' &&
    q.kind !== 'number' &&
    !session.checked[q.id]
  ) {
    const order = optionOrder(q, session.seed + session.index * 97),
      i = order[Number(ev.key) - 1],
      input = $(`#answer-${i}`);
    if (input) {
      input.checked = !input.checked || q.kind === 'single';
      input.dispatchEvent(new Event('change', { bubbles: true }));
      ev.preventDefault();
    }
  }
  if (ev.key === 'Enter' && session.kind !== 'exam') {
    ev.preventDefault();
    session.checked[q.id] ? next() : check();
  }
});
const requestedTopic = Number(
  new URLSearchParams(location.search).get('module')
);
if (Number.isInteger(requestedTopic) && topicById.has(requestedTopic))
  topic = requestedTopic;
save();
home();
</script>
  </body>
</html>
